x-ownership:
  host: gateway.caretta.app
  justification: >-
    gateway.caretta.app is a different registrable domain from the marketing
    site caretta.so, but Caretta's own documentation at
    https://www.caretta.so/docs/caretta-mcp names https://gateway.caretta.app/mcp
    as "the Caretta MCP server" in three separate client setup examples, and the
    endpoint's own RFC 9728 metadata points resource_documentation back at
    https://caretta.so/docs/caretta-mcp. The two hosts cross-reference each other.
