name: Caretta
description: >-
  Caretta is a Y Combinator-backed (W26) startup building a real-time AI
  platform for sales teams. Its assistant joins reps in live calls to take
  notes and surface relevant answers to information requests, questions, and
  objections in real time, drawing on an organizational knowledge layer it
  calls "Caretta Nous" that is built from company documentation, websites,
  internal playbooks, and top-performer conversations. After calls it supports
  teamspaces with analysis, morning briefs, and follow-up Q&A, and integrates
  with tools such as Zoom, Google Meet, Microsoft Teams, Salesforce, HubSpot,
  Pipedrive, Attio, Odoo, Cal.com, Slack, Telegram and Notion. The company
  raised $1.3M in pre-seed funding. Caretta's developer surface is
  agent-first rather than REST-first: it publishes a documented remote Model
  Context Protocol server at gateway.caretta.app/mcp with OAuth-scoped access
  to calls, transcripts and todos, a signed HMAC-SHA256 webhook surface that
  pushes transcripts, AI notes and evaluated metrics to customer endpoints,
  and a Zoom meeting-link integration. Its docs host serves llms.txt, an A2A
  agent card and a published Agent Skill. Caretta's own documentation states
  that a public REST API for endpoint management is planned but not yet
  available, so no OpenAPI description is published.
