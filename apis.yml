apis:
- name: Caretta MCP Server
  description: >-
    Remote Model Context Protocol server that gives compatible AI clients
    OAuth-scoped access to the Caretta calls, transcripts and todos the
    signed-in user can already see. Seven documented tools cover listing and
    searching calls, retrieving a call with its transcript and todos, and
    listing, creating and updating todos. Authorization is browser-based
    OAuth with three product scopes (calls:read, todos:read, todos:write);
    no API key is issued. The endpoint advertises an RFC 9728 OAuth
    protected-resource document and returns a WWW-Authenticate challenge to
    unauthenticated callers.
  humanURL: https://www.caretta.so/docs/caretta-mcp
  baseURL: https://gateway.caretta.app/mcp
