published_time_budgets:
  note: >-
    These are delivery and validation budgets, NOT rate limits. They are the
    only numeric operational constraints Caretta publishes and are recorded here
    so they are not mistaken for throttling policy.
  budgets:
  - name: webhook acknowledgement timeout
    value: 10 seconds
    applies_to: consumer endpoint
    description: The consumer must return a 2xx response within 10 seconds.
    source: https://www.caretta.so/docs/webhooks
  - name: webhook retry window
    value: approximately 2 hours
    applies_to: Caretta delivery
    description: Failed requests are retried with backoff for roughly two hours.
    source: https://www.caretta.so/docs/webhooks
  - name: signature replay window
    value: 300 seconds
    applies_to: consumer verification
    description: Reject requests whose X-Caretta-Timestamp is more than five minutes old.
    source: https://www.caretta.so/docs/webhooks
  - name: call eligibility floor
    value: 60 seconds
    applies_to: event generation
    description: >-
      Calls of 60 seconds or less do not produce delivery events. A volume
      filter on the event stream, not a rate limit.
    source: https://www.caretta.so/docs/webhooks

