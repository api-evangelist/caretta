summary: >-
  Caretta publishes no rate limits and no rate-limit response headers. Neither
  the MCP documentation nor the webhook documentation states a request ceiling,
  a window, a burst allowance, or what an agent should expect on exhaustion. No
  429 was observed. An MCP client integrating against Caretta has no published
  runtime signal to back off on — this is a real gap, recorded as an honest
  zero rather than omitted.

